# Security updates only for npm, cargo and uv: open-pull-requests-limit 0
# turns their version updates off, and security PRs don't count toward it.
# In-range updates come in through `just update` before each release; a major
# is one family-wide sweep, listed by the weekly audit. GitHub Actions keep
# weekly version updates. Commits are chore(deps), so a bump never releases on
# its own.
# Guidance: design/family-alignment.md, row 7a.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
