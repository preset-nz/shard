name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check
    # macOS, because that is the only platform Shard ships for and it needs no
    # system libraries installed first (Linux would want webkit2gtk and ALSA
    # before clippy could compile the app crate). Free on a public repo.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      # `just check` ends with `just licences`; install-only (no args).
      - uses: preset-nz/compliance@v0.1.1
      - run: pnpm install --frozen-lockfile
      # The app crate's build script embeds the frontend, so `dist/` has to
      # exist before cargo compiles it. It is git-ignored.
      - run: pnpm build
      # fmt, clippy -D warnings, the tests (the audio-thread allocation guard
      # included: it needs no sound card), tsc, biome and the licence gate.
      - run: just check
