# The family's shared check: toolchains from this repo, then `just check`.
# guidance projects/workflows; the workflow lives in preset-nz/workflows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: preset-nz/workflows/.github/workflows/check.yml@v1
    with:
      tauri: true
