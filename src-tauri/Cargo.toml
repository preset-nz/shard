[package]
name = "shard"
description = "Shard — sample shaping instrument"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows
# linker quirk, see https://github.com/rust-lang/cargo/issues/8519).
name = "shard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The session lives in rhizome (epic 32), from crates.io. Try a local change with a
# temporary [patch.crates-io] rhizome-* = { path = "..." }, never committed.
rhizome-core = "0.1.4"
rhizome-pom = "0.1.4"
# Menus, undo titles, files and relaunch, shared with the family (epic 32, story 4).
preset-app-kit = "0.1.1"
shard-dsp.workspace = true
cpal.workspace = true
hound.workspace = true
midir.workspace = true
tauri-plugin-window-state = "2"
