[package]
name = "shard"
description = "Shard — sample shaping instrument"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows
# linker quirk, see https://github.com/rust-lang/cargo/issues/8519).
name = "shard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Registered by app-kit; a direct dependency only so the webview's
# `dialog:default` permission resolves (Add Material…'s panel).
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The session lives in rhizome (epic 32).
rhizome-core = "0.1.7"
rhizome-pom = "0.1.7"
# Menus, undo titles, files and relaunch, shared with the family (epic 32, story 4).
preset-app-kit = "0.1.3"
shard-dsp.workspace = true
# A mod envelope is a curve, and the document holds it as JSON.
preset-math = { version = "0.1", features = ["serde"] }
cpal.workspace = true
hound.workspace = true
midir.workspace = true

[dev-dependencies]
# `just docs`: node pages from the schema (examples/shard-docs.rs).
preset-docs = { version = "0.1", features = ["rhizome"] }
